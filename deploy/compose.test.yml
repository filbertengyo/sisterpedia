# Test stack: same two services as docker-compose.yml but with a throw-away
# database (tmpfs), so every run starts clean. Used for manual U01-U10 runs in
# the browser and for Playwright against containers:
#
#   docker compose -f deploy/compose.test.yml up --build --wait
#   cd web && PW_SERVER_PORT=8000 ... (or open http://localhost:3000)
#   docker compose -f deploy/compose.test.yml down -v
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment:
      SERVER_ADDR: ":8000"
      DB_PATH: /tmp/shop.db
      CATALOG_PATH: /app/data/catalog.json
      CKKS_PROFILES_FILE: /app/config/profiles.yaml
      ALLOWED_PROFILES: p1,p2
      ALLOWED_ORIGIN: http://localhost:3000
      MAX_BODY_BYTES: "16777216"
    tmpfs:
      - /tmp
    volumes:
      - ../data:/app/data:ro
      - ../config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_API: http://localhost:8000
        NEXT_PUBLIC_MOCK: "0"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20
