# Skeleton S0.3a: tiga service dengan trust boundary jaringan.
# Detail lanjutan (CI, compose.test, hardening) dikerjakan di issue OPS (#17).
#
#   browser -> web (:3000) -> client (:8001, kripto + kunci) -> server (:8000, ciphertext saja)
#   client-net : web <-> client
#   server-net : client <-> server        (web TIDAK terhubung ke server)
#   volume client_data hanya di client; server_data hanya di server.

services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment:
      SERVER_ADDR: ":8000"
      DB_PATH: /data/shop.db
      CATALOG_PATH: /app/data/catalog.json
      CKKS_PROFILES_FILE: /app/config/profiles.yaml
      ALLOWED_PROFILES: ${ALLOWED_PROFILES:-p1,p2}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8388608}
    volumes:
      - server_data:/data
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    networks: [server-net]
    ports:
      - "127.0.0.1:8000:8000"   # hanya untuk debug/curl dari host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: deploy/Dockerfile.client
    environment:
      LISTEN_ADDR: ":8001"
      SERVER_URL: http://server:8000
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
      CLIENT_DATA_DIR: /client_data
      CKKS_PROFILE: ${CKKS_PROFILE:-p1}
      CKKS_PROFILES_FILE: /app/config/profiles.yaml
      AUDIT: ${AUDIT:-0}
    volumes:
      - client_data:/client_data
      - ./config:/app/config:ro
    networks: [client-net, server-net]
    ports:
      - "127.0.0.1:8001:8001"   # dipanggil browser oleh GUI
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # nilai ini dibakar saat build dan dipakai browser, jadi harus alamat dari sisi host
        NEXT_PUBLIC_CLIENT_API: ${NEXT_PUBLIC_CLIENT_API:-http://localhost:8001}
        NEXT_PUBLIC_MOCK: ${NEXT_PUBLIC_MOCK:-0}
    networks: [client-net]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      client:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  client-net:
  server-net:

volumes:
  client_data:
  server_data:
