# Two services. All user-side cryptography runs in the browser (Lattigo compiled to
# WebAssembly, served by `web`), so there is no client service anymore.
#
#   browser (WASM crypto + IndexedDB keys) -> web (:3000, static GUI + crypto.wasm)
#   browser ------------------------------> server (:8000, ciphertext + public artifacts only)
#
# The server never receives a secret key; the secret key never leaves the browser.
# Volume server_data belongs to the server only.

services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment:
      SERVER_ADDR: ":8000"
      DB_PATH: /data/shop.db
      CATALOG_PATH: /app/data/catalog.json
      CKKS_PROFILES_FILE: /app/config/profiles.yaml
      ALLOWED_PROFILES: ${ALLOWED_PROFILES:-p1,p2}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-16777216}
    volumes:
      - server_data:/data
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"   # the browser calls the server directly (CORS: ALLOWED_ORIGIN)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # baked in at build time and used by the browser, so it must be a host-reachable address
        NEXT_PUBLIC_SERVER_API: ${NEXT_PUBLIC_SERVER_API:-http://localhost:8000}
        NEXT_PUBLIC_MOCK: ${NEXT_PUBLIC_MOCK:-0}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  server_data:
