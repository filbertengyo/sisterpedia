# CKKS parameter profiles (see docs/PARAMS.md).
# Verified in a spike with Lattigo v6.2.0 (native + WASM): both profiles are accepted
# and the reference computation stays within 1.4e-4. A1.1 formalizes the loader.
# Select a profile with the CKKS_PROFILE env var (p1 | p2).
profiles:
  p1:
    log_n: 13
    log_q: [60, 40, 40]      # level 2 => exactly two chained multiplications
    log_p: [61]
    log_default_scale: 40
  p2:
    log_n: 14
    log_q: [60, 40, 40, 40]  # level 3 => one spare level
    log_p: [61]
    log_default_scale: 40
