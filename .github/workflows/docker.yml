name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build images and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start stack and wait for healthchecks
        run: docker compose up -d --wait --wait-timeout 180
      - name: Health endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8001/healthz
          curl -fsS -o /dev/null http://127.0.0.1:3000/
      - name: Trust boundary - web must not reach server
        run: |
          if docker compose exec -T web wget -qO- -T 3 http://server:8000/healthz; then
            echo "web can reach server: network isolation is broken"; exit 1
          fi
          echo "isolated as expected"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
