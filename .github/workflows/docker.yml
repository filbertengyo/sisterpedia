name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build images and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build images (server, web incl. WASM crypto bridge)
        run: docker compose build
      - name: Start stack and wait for healthchecks
        run: docker compose up -d --wait --wait-timeout 180
      - name: Health endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -o /dev/null http://127.0.0.1:3000/
      - name: WASM bridge assets are served by the web image
        run: |
          curl -fsSI http://127.0.0.1:3000/crypto.wasm | grep -iE '^(HTTP|content-type|content-length)'
          curl -fsSI http://127.0.0.1:3000/wasm_exec.js | head -1
      - name: CORS - server only allows the web origin
        run: |
          ok="$(curl -fsSI -X OPTIONS http://127.0.0.1:8000/healthz \
            -H 'Origin: http://localhost:3000' \
            -H 'Access-Control-Request-Method: GET' | tr -d '\r' | grep -i '^access-control-allow-origin' || true)"
          echo "allowed origin response: [$ok]"
          echo "$ok" | grep -qi "http://localhost:3000" || { echo "CORS header missing for the web origin"; exit 1; }
          bad="$(curl -sSI -X OPTIONS http://127.0.0.1:8000/healthz \
            -H 'Origin: http://evil.example' \
            -H 'Access-Control-Request-Method: GET' | tr -d '\r' | grep -i '^access-control-allow-origin' || true)"
          [ -z "$bad" ] || { echo "foreign origin must not be allowed: $bad"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
