name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vet, build, test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -cover ./...
      # browser crypto bridge must keep compiling as WebAssembly
      - name: Build and vet WASM target
        run: |
          GOOS=js GOARCH=wasm go vet ./cmd/wasm
          GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/wasm

  lint:
    name: Go lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          # config: .golangci.yml (includes gofmt formatter check)

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Next generates global types (e.g. LayoutProps) into .next/types; tsc needs them
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  compliance:
    name: Compliance (trust boundary rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No tracked private keys or .env (except TEST ONLY fixtures)
        run: |
          bad="$(git ls-files | grep -E '(\.key$|(^|/)\.env$)' | grep -v '^tests/fixtures/keys/' || true)"
          if [ -n "$bad" ]; then echo "Forbidden tracked files:"; echo "$bad"; exit 1; fi
      - name: Server code must not reference secret keys or decryption
        run: |
          paths=""
          for p in cmd/server internal/server; do [ -d "$p" ] && paths="$paths $p"; done
          if [ -n "$paths" ] && grep -RInE --include='*.go' 'SecretKey|Decryptor' $paths; then
            echo "Server code must never reference SecretKey/Decryptor"; exit 1
          fi
          echo "ok"
